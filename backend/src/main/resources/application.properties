spring.application.name=proposal

# Database configuration with defaults for local development
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.dmnilwzmxrfuxdtziybb}
spring.datasource.password=${DB_PASSWORD:Jayendra@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
